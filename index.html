<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一個關於升學、選擇與自我探索的互動故事。">
  <title>繞了一圈，才開始｜互動人生選擇</title>
  <style>
    :root {
      --bg: #f4f0e8;
      --paper: #fffdf8;
      --ink: #292821;
      --muted: #777366;
      --accent: #8b6651;
      --accent-dark: #684936;
      --line: #e7dfd2;
      --soft: #eee5d9;
      --shadow: 0 18px 55px rgba(54, 42, 29, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: radial-gradient(circle at 15% 10%, #fffaf0 0, transparent 32%),
                  linear-gradient(135deg, #f4f0e8, #ebe4d8);
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      display: grid; place-items: center; padding: 28px 16px;
    }
    .shell { width: min(760px, 100%); }
    .topline {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 0 4px 14px; color: var(--muted);
      font: 12px/1.5 Arial, sans-serif; letter-spacing: .14em;
    }
    .progress { height: 3px; background: #ded5c8; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
    main {
      background: rgba(255,253,248,.94); border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px; box-shadow: var(--shadow); padding: clamp(26px, 6vw, 58px);
      min-height: 510px; position: relative; overflow: hidden;
    }
    main::before {
      content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
      background: #f0e8dc; right: -120px; top: -120px; opacity: .55;
    }
    .eyebrow { color: var(--accent); font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.28; letter-spacing: .04em; margin: 18px 0 14px; font-weight: 600; }
    h2 { font-size: clamp(24px, 4vw, 32px); line-height: 1.45; margin: 14px 0 18px; font-weight: 600; }
    .lead { color: #5f5a50; font-size: 16px; line-height: 2; max-width: 560px; }
    .story { white-space: pre-line; color: #4d493f; font-size: 16px; line-height: 2.05; margin: 18px 0 26px; }
    .choices { display: grid; gap: 12px; margin-top: 28px; }
    button {
      font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 12px;
      background: var(--paper); color: var(--ink); padding: 16px 18px; text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    button:hover { transform: translateY(-2px); border-color: #b89b83; background: #fbf6ee; }
    button:focus-visible { outline: 3px solid #c6a88e; outline-offset: 3px; }
    .choice-title { display: block; font-weight: 700; font-size: 16px; margin-bottom: 5px; }
    .choice-desc { display: block; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .actions button { text-align: center; padding: 11px 16px; font: 14px Arial, sans-serif; }
    .primary { background: var(--accent); color: white; border-color: var(--accent); }
    .primary:hover { background: var(--accent-dark); color: white; }
    .secondary { background: transparent; }
    .ending-mark { font-size: 30px; margin: 18px 0 4px; color: var(--accent); }
    .quote { border-left: 2px solid #b99b83; padding: 4px 0 4px 18px; color: #716354; font-style: italic; line-height: 1.9; margin: 24px 0; }
    footer { text-align: center; color: #8b8579; font: 11px/1.7 Arial, sans-serif; letter-spacing: .08em; margin: 18px 0 0; }
    @media (max-width: 520px) {
      body { padding: 14px 10px; }
      main { min-height: 0; border-radius: 16px; }
      .topline { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topline"><span>INTERACTIVE STORY / 人生選擇</span><span id="stepLabel">序章</span></div>
    <div class="progress" aria-label="故事進度"><span id="progressBar"></span></div>
    <main id="storyCard" aria-live="polite">
      <div class="eyebrow">A STORY ABOUT CHOICES</div>
      <h1>繞了一圈，<br>才開始。</h1>
      <p class="lead">人生很少只有一條正確的路。有時候，我們在岔路口猶豫，不是因為不知道答案，而是每個答案都意味著放下些什麼。</p>
      <p class="story">這是一段關於升學、期待，以及慢慢認識自己的故事。

你將站在幾個重要的選擇面前。請選擇當下最想走的方向，看看故事會如何繼續。</p>
      <div class="actions"><button class="primary" id="startBtn">開始這段旅程 →</button></div>
    </main>
    <footer>每一個選擇，都會成為故事的一部分。</footer>
  </div>

  <script>
    const scenes = {
      start: {
        step: "第一個岔路",
        progress: 25,
        eyebrow: "CHAPTER 01 / THE FIRST CROSSROAD",
        title: "如果重新選一次，<br>你會走向哪裡？",
        story: "面對升學，你的眼前出現了兩個截然不同的方向。\\n\\n一邊是台大，代表著相對明確的學習路徑與更多元的資源；另一邊是北藝大，靠近創作、藝術，以及你心中那份還沒完全說出口的嚮往。\\n\\n兩條路都有吸引你的地方，也都有未知。",
        choices: [
          ["台大", "選擇一條看起來較穩定、資源也較多的道路。", "ntu"],
          ["北藝大", "走向更貼近創作與內心興趣的方向。", "tna"]
        ]
      },
      tna: {
        step: "第二個岔路・北藝大",
        progress: 50,
        eyebrow: "CHAPTER 02 / THE ARTISTIC PATH",
        title: "到了北藝大，<br>你開始懷疑自己。",
        story: "真正走進藝術領域後，你發現熱情並不總是浪漫的。課業、創作壓力，以及對未來的不確定，讓你開始思考：當初的選擇是不是太衝動？\\n\\n你面前出現兩個方向。",
        choices: [
          ["重新準備考試", "承認自己還有遺憾，再給自己一次改變方向的機會。", "ending_tna_retry"],
          ["留下來完成學業", "接受這段經歷，試著在原本的道路上找到自己的位置。", "ending_tna_stay"]
        ]
      },
      ntu: {
        step: "第二個岔路・台大",
        progress: 50,
        eyebrow: "CHAPTER 02 / THE STABLE PATH",
        title: "看似穩定的路，<br>真的適合你嗎？",
        story: "進入台大後，你擁有更多資源，也逐漸看見一條清楚的未來：好好念書、累積經歷，畢業後找到一份穩定的工作。\\n\\n然而，當生活逐漸走上軌道，你也開始問自己：除了符合期待，我還想成為什麼樣的人？",
        choices: [
          ["選擇穩定的道路", "把握現有資源，朝著明確的升學或就業方向前進。", "ending_ntu_stable"],
          ["探索其他興趣", "在既有道路之外，留一些時間給真正好奇的事物。", "ending_ntu_explore"]
        ]
      },
      ending_tna_retry: {
        step: "結局一・再次出發", progress: 100, ending: true,
        eyebrow: "ENDING 01 / BEGIN AGAIN",
        title: "再次出發，<br>不代表之前白走了。",
        story: "你決定重新準備考試。這段時間並不容易，因為你必須面對不確定，也必須承受再次失敗的可能。\\n\\n但這一次，你比以前更清楚自己為什麼出發。過去的經驗讓你知道，選擇不是為了證明自己比別人好，而是希望更靠近真正想要的生活。\\n\\n也許結果未必完全如願，但你已經學會為自己的決定負責。",
        quote: "「繞遠路不一定是浪費時間，有時候是為了更清楚自己要去哪裡。」"
      },
      ending_tna_stay: {
        step: "結局二・留下來的勇氣", progress: 100, ending: true,
        eyebrow: "ENDING 02 / MAKE IT YOUR OWN",
        title: "留下來，<br>也能走出自己的方向。",
        story: "你決定完成學業，不再只把當初的選擇看成對或錯。你開始嘗試不同的創作方式，也慢慢理解，喜歡一件事不代表每天都會充滿熱情。\\n\\n留下來不是放棄其他可能，而是選擇先把眼前的路走深。你不知道未來會通往哪裡，但你願意讓這段經歷成為自己的養分。",
        quote: "「重要的不是每一步都選對，而是走過之後，仍願意理解自己。」"
      },
      ending_ntu_stable: {
        step: "結局三・安穩之中", progress: 100, ending: true,
        eyebrow: "ENDING 03 / STEADY GROUND",
        title: "選擇安穩，<br>也是一種踏實的勇氣。",
        story: "你決定沿著較明確的方向前進，專注學業、累積能力，為未來建立穩固的基礎。這條路不一定時時令人興奮，卻讓你有餘裕規劃生活，也逐漸看見努力帶來的成果。\\n\\n偶爾你仍會想像另一種人生，但你明白，安穩並不等於沒有夢想。只要知道自己為什麼選擇，就能在平凡的日子裡找到意義。",
        quote: "「不是每個夢想都要轟轟烈烈，有些人生是一步一步走穩的。」"
      },
      ending_ntu_explore: {
        step: "結局四・保留可能", progress: 100, ending: true,
        eyebrow: "ENDING 04 / KEEP EXPLORING",
        title: "在既定道路之外，<br>替自己保留可能。",
        story: "你沒有放棄原本的學業，而是開始接觸不同領域、參加活動，或投入一直想嘗試的興趣。這樣的生活需要更多時間安排，也可能讓你一度感到迷惘。\\n\\n但你慢慢發現，人生不一定只能用單一標準衡量。你可以追求穩定，也可以保留好奇；可以走在一條路上，同時為未來打開其他門。",
        quote: "「人生不是只能選一種樣子，探索也是一種認真生活的方式。」"
      }
    };

    const card = document.getElementById("storyCard");
    const progressBar = document.getElementById("progressBar");
    const stepLabel = document.getElementById("stepLabel");
    const history = [];

    function render(sceneId) {
      const scene = scenes[sceneId];
      stepLabel.textContent = scene.step;
      progressBar.style.width = scene.progress + "%";
      let html = `<div class="eyebrow">${scene.eyebrow}</div><h2>${scene.title}</h2><p class="story">${scene.story}</p>`;
      if (scene.ending) {
        html += `<div class="ending-mark">✦</div><div class="quote">${scene.quote}</div>
          <div class="actions">
            <button class="secondary" id="backBtn">← 回到上一個選擇</button>
            <button class="primary" id="restartBtn">重新開始 ↻</button>
          </div>`;
      } else {
        html += `<div class="choices">${scene.choices.map(([title, desc, next]) =>
          `<button class="choice" data-next="${next}"><span class="choice-title">${title}</span><span class="choice-desc">${desc}</span></button>`
        ).join("")}</div><div class="actions"><button class="secondary" id="backBtn">← 回到上一頁</button></div>`;
      }
      card.innerHTML = html;
      card.querySelectorAll("[data-next]").forEach(btn => {
        btn.addEventListener("click", () => {
          history.push(sceneId);
          render(btn.dataset.next);
        });
      });
      const back = document.getElementById("backBtn");
      if (back) back.addEventListener("click", () => {
        if (history.length) render(history.pop());
        else render("intro");
      });
      const restart = document.getElementById("restartBtn");
      if (restart) restart.addEventListener("click", () => {
        history.length = 0;
        render("start");
      });
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      history.length = 0;
      render("start");
    });

    // 回到序章時使用的簡單畫面
    function showIntro() {
      stepLabel.textContent = "序章";
      progressBar.style.width = "0%";
      card.innerHTML = `<div class="eyebrow">A STORY ABOUT CHOICES</div>
        <h1>繞了一圈，<br>才開始。</h1>
        <p class="lead">人生很少只有一條正確的路。有時候，我們在岔路口猶豫，不是因為不知道答案，而是每個答案都意味著放下些什麼。</p>
        <p class="story">這是一段關於升學、期待，以及慢慢認識自己的故事。\\n\\n你將站在幾個重要的選擇面前。請選擇當下最想走的方向，看看故事會如何繼續。</p>
        <div class="actions"><button class="primary" id="startBtn">開始這段旅程 →</button></div>`;
      document.getElementById("startBtn").addEventListener("click", () => {
        history.length = 0;
        render("start");
      });
    }
    // 將第一頁的返回按鈕帶回封面
    const originalRender = render;
    render = function(sceneId) {
      if (sceneId === "intro") { showIntro(); return; }
      originalRender(sceneId);
    };
  </script>
</body>
</html>
